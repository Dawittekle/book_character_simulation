[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "book-character-simulation-backend"
version = "0.1.0"
description = "Backend services for the book character simulation project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2.0",
  "Flask>=3.0,<4.0",
  "Flask-Cors>=4.0,<6.0",
  "PyJWT[crypto]>=2.9,<3.0",
  "PyMuPDF>=1.24,<2.0",
  "SQLAlchemy>=2.0,<3.0",
  "google-genai>=0.5,<1.0",
  "gunicorn>=22.0,<24.0",
  "openai>=1.35,<2.0",
  "overrides>=7.7,<8.0",
  "pydantic>=2.8,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "python-dotenv>=1.0,<2.0",
  "requests>=2.32,<3.0",
  "boto3>=1.34,<2.0",
  "pgvector>=0.3.0,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<8.0",
  "pytest-mock>=3.14,<4.0",
  "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff.lint]
ignore = ["E402"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
