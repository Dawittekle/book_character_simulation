services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lorely_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/chroma_db:/app/chroma_db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lorely_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
