  </defs>
  <rect width="300" height="420" rx="8" fill="url(#echoes-bg)"/>
  <rect x="12" y="12" width="276" height="396" rx="6" fill="none" stroke="#C89D5C" stroke-width="1.5" stroke-opacity="0.6"/>
