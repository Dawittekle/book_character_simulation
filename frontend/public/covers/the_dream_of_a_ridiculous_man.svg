<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cosmic-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#180A2E"/>
      <stop offset="45%" stop-color="#2D124D"/>
      <stop offset="85%" stop-color="#140726"/>
      <stop offset="100%" stop-color="#0B0314"/>
    </linearGradient>
    <radialGradient id="star-burst" cx="50%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="15%" stop-color="#FDE047" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#A855F7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2D124D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="420" rx="8" fill="url(#cosmic-bg)"/>
  <rect x="12" y="12" width="276" height="396" rx="6" fill="none" stroke="#C084FC" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Celestial Glow & Edenic Star -->
  <circle cx="150" cy="145" r="75" fill="url(#star-burst)"/>
  <circle cx="150" cy="145" r="16" fill="#FFFFFF"/>

  <!-- Orbital Rings of the Duplicate Earth -->
  <ellipse cx="150" cy="145" rx="70" ry="25" fill="none" stroke="#FDE047" stroke-width="1" stroke-dasharray="4,4" opacity="0.8"/>
  <ellipse cx="150" cy="145" rx="95" ry="36" fill="none" stroke="#C084FC" stroke-width="1" opacity="0.6"/>

  <!-- Contemplative Silhouette of the Man -->
  <circle cx="150" cy="245" r="12" fill="#090212"/>
  <path d="M130 290 C130 262 170 262 170 290 Z" fill="#090212"/>
  <circle cx="150" cy="245" r="13" fill="none" stroke="#FDE047" stroke-width="1" opacity="0.6"/>

  <!-- Radiating Rays of Truth -->
  <line x1="150" y1="60" x2="150" y2="105" stroke="#FDE047" stroke-width="1.5" opacity="0.7"/>
  <line x1="85" y1="145" x2="120" y2="145" stroke="#FDE047" stroke-width="1.5" opacity="0.7"/>
  <line x1="180" y1="145" x2="215" y2="145" stroke="#FDE047" stroke-width="1.5" opacity="0.7"/>
  <line x1="105" y1="100" x2="125" y2="120" stroke="#FDE047" stroke-width="1.5" opacity="0.7"/>
  <line x1="195" y1="100" x2="175" y2="120" stroke="#FDE047" stroke-width="1.5" opacity="0.7"/>

  <!-- Star points -->
  <circle cx="50" cy="70" r="1.5" fill="#FFFFFF"/>
  <circle cx="85" cy="50" r="1.2" fill="#FDE047"/>
  <circle cx="230" cy="80" r="1.5" fill="#FFFFFF"/>
  <circle cx="260" cy="60" r="1.2" fill="#FDE047"/>
  <circle cx="65" cy="220" r="1.2" fill="#FFFFFF"/>
  <circle cx="235" cy="215" r="1.2" fill="#FFFFFF"/>

  <!-- Typography Divider & Labels -->
  <line x1="30" y1="330" x2="270" y2="330" stroke="#C084FC" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="150" y="354" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="12" font-weight="700" fill="#FFFDF0" letter-spacing="1.2">THE DREAM OF A</text>
  <text x="150" y="372" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" fill="#FDE047" letter-spacing="1.5">RIDICULOUS MAN</text>
  <text x="150" y="392" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#E9D5FF" letter-spacing="1.5">FYODOR DOSTOEVSKY</text>
</svg>