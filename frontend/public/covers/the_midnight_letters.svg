  </defs>
  <rect width="300" height="420" rx="8" fill="url(#midnight-bg)"/>
  <rect x="12" y="12" width="276" height="396" rx="6" fill="none" stroke="#C89D5C" stroke-width="1.5" stroke-opacity="0.6"/>
  <circle cx="150" cy="130" r="45" fill="url(#moon)"/>
  <circle cx="150" cy="130" r="28" fill="#F4EED4"/>
