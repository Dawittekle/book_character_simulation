  <circle cx="95" cy="110" r="1.2" fill="#D4AF37"/>
  <circle cx="230" cy="65" r="1.5" fill="#D4AF37"/>
  <circle cx="210" cy="120" r="1.2" fill="#D4AF37"/>
  <circle cx="80" cy="190" r="1.2" fill="#D4AF37"/>
